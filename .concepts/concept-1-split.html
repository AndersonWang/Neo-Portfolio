<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept 1 — The Split World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #050A05;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    cursor: default;
  }

  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }

  /* ── Vignette ────────────────────────────────────── */
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.65) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* ── Center content ──────────────────────────────── */
  #content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10;
    pointer-events: none;
  }

  #headline {
    font-size: clamp(2rem, 5vw, 3.75rem);
    font-weight: 700;
    color: #fff;
    text-align: center;
    line-height: 1.08;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 2px 40px rgba(0,0,0,0.6);
    max-width: 820px;
    padding: 0 2rem;
  }

  #subline {
    font-size: 1.0625rem;
    color: rgba(255,255,255,0.45);
    margin-bottom: 2.75rem;
    letter-spacing: 0.01em;
    text-align: center;
  }

  /* ── Pills + descriptions ────────────────────────── */
  #pills-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    pointer-events: all;
  }

  #pills-row {
    display: flex;
    gap: 1.25rem;
    max-width: 520px;
    width: 100%;
  }

  .pill {
    flex: 1;
    padding: 0.9rem 2.4rem;
    border-radius: 100px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    letter-spacing: 0.01em;
    transition:
      transform    0.3s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow   0.3s ease,
      opacity      0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .pill::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    background: rgba(255,255,255,0.18);
    opacity: 0;
    transition: opacity 0.25s;
  }
  .pill:hover::after { opacity: 1; }
  .pill:hover        { transform: scale(1.06) translateY(-3px); }
  .pill:active       { transform: scale(0.97) translateY(0); }

  #pill-past {
    background: #C0392B;
    color: #fff;
    box-shadow: 0 6px 28px rgba(192, 57, 43, 0.45);
  }
  #pill-past:hover {
    box-shadow: 0 10px 40px rgba(192, 57, 43, 0.65);
  }
  #pill-future {
    background: #2471A3;
    color: #fff;
    box-shadow: 0 6px 28px rgba(36, 113, 163, 0.45);
  }
  #pill-future:hover {
    box-shadow: 0 10px 40px rgba(52, 152, 219, 0.65);
  }

  /* dim opposite pill on hover */
  body.hover-past   #pill-future { opacity: 0.38; transform: scale(0.93); }
  body.hover-future #pill-past   { opacity: 0.38; transform: scale(0.93); }

  /* ── Description row ─────────────────────────────── */
  #descs-row {
    display: flex;
    gap: 1.25rem;
    width: 100%;
    max-width: 520px;
  }

  .pill-desc {
    flex: 1;
    text-align: center;
    font-size: 0.8125rem;
    font-family: monospace;
    letter-spacing: 0.02em;
    line-height: 1.6;
    color: rgba(255,255,255,0.3);
    transition: color 0.4s ease, text-shadow 0.4s ease;
    padding: 0 0.5rem;
    pointer-events: none;
  }

  body.hover-past #desc-past {
    color: rgba(255, 180, 80, 0.95);
    text-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
  }
  body.hover-past #desc-future {
    color: rgba(255,255,255,0.12);
  }

  body.hover-future #desc-future {
    color: rgba(120, 190, 255, 0.95);
    text-shadow: 0 0 20px rgba(52, 152, 219, 0.5);
  }
  body.hover-future #desc-past {
    color: rgba(255,255,255,0.12);
  }

  /* ── Corner / note labels ────────────────────────── */
  #corner-label {
    position: absolute; top: 2rem; left: 2rem;
    z-index: 20;
    font-size: 0.6875rem; font-family: monospace;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  #note {
    position: absolute; bottom: 2rem; left: 50%;
    transform: translateX(-50%);
    font-size: 0.6875rem; font-family: monospace;
    color: rgba(255,255,255,0.15);
    letter-spacing: 0.08em; text-transform: uppercase;
    z-index: 20; white-space: nowrap;
  }
</style>
</head>
<body>

<div id="corner-label">Concept 1 — Matrix Paths</div>
<div id="note">Hover a pill to shift the world</div>

<canvas id="c"></canvas>
<div id="vignette"></div>

<div id="content">
  <h1 id="headline">Which side of me are<br>you most interested in?</h1>
  <p  id="subline">The choice is yours.</p>

  <div id="pills-area">
    <div id="pills-row">
      <button class="pill" id="pill-past"
        onmouseenter="activate('past')"
        onmouseleave="deactivate()"
        onclick="navigate('past')">
        the past
      </button>
      <button class="pill" id="pill-future"
        onmouseenter="activate('future')"
        onmouseleave="deactivate()"
        onclick="navigate('future')">
        the future
      </button>
    </div>

    <div id="descs-row">
      <p class="pill-desc" id="desc-past">
        Proven craft.<br>Systems thinking.<br>Works that got me here.
      </p>
      <p class="pill-desc" id="desc-future">
        AI-native process.<br>Experiments.<br>Where I'm heading.
      </p>
    </div>
  </div>
</div>

<script>
// ── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let cols, drops, W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cols  = Math.floor(W / 20);
  drops = Array.from({ length: cols }, () => -Math.random() * H / 20);
}
resize();
window.addEventListener('resize', resize);

const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン三能發等面人生學子出後之以定多是電在和ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

// t = 0 → pure green, t = 1 → amber/orange
// lerp is smooth — driven by requestAnimationFrame
let targetT = 0;
let currentT = 0;

function draw() {
  // Smooth lerp toward target
  currentT += (targetT - currentT) * 0.05;

  // Background fade: dark green ↔ dark amber
  const bgR = Math.round(5  + (20  - 5)  * currentT);
  const bgG = Math.round(10 + (8   - 10) * currentT);
  const bgB = Math.round(5  + (2   - 5)  * currentT);
  ctx.fillStyle = `rgba(${bgR},${bgG},${bgB},0.065)`;
  ctx.fillRect(0, 0, W, H);

  ctx.font = '14px monospace';

  for (let i = 0; i < drops.length; i++) {
    const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
    const y  = drops[i] * 20;

    const isHead = Math.random() > 0.88;

    if (isHead) {
      // Head char: white-green ↔ white-amber
      const headR = Math.round(180 + (255 - 180) * currentT);
      const headG = Math.round(255 + (200 - 255) * currentT);
      const headB = Math.round(180 + (80  - 180) * currentT);
      ctx.fillStyle   = `rgb(${headR},${headG},${headB})`;
      ctx.shadowColor = currentT < 0.5
        ? `rgba(0,255,65,${0.8 * (1 - currentT * 2)})`
        : `rgba(255,160,0,${0.8 * (currentT - 0.5) * 2})`;
      ctx.shadowBlur = 8;
    } else {
      // Body chars: green ↔ amber
      const r = Math.round(0   + (180 - 0)   * currentT);
      const g = Math.round(160 + (100 - 160) * currentT);
      const b = Math.round(40  + (0   - 40)  * currentT);
      // dim half the chars for depth
      const dim = Math.random() > 0.5 ? 1 : 0.4;
      ctx.fillStyle = `rgba(${r},${g},${b},${dim})`;
      ctx.shadowBlur = 0;
    }

    ctx.fillText(ch, i * 20, y);
    ctx.shadowBlur = 0;

    if (y > H && Math.random() > 0.975) drops[i] = 0;
    drops[i] += 0.4;
  }

  requestAnimationFrame(draw);
}
draw();

// ── Interaction ───────────────────────────────────────────────────────────────
function activate(side) {
  document.body.classList.add('hover-' + side);
  targetT = side === 'past' ? 1 : 0;
}

function deactivate() {
  document.body.classList.remove('hover-past', 'hover-future');
  targetT = 0; // return to green
}

function navigate(side) {
  alert(`→ Navigating to "${side === 'past' ? 'Portfolio' : 'Lab / Experiments'}" — wire up routing here`);
}
</script>
</body>
</html>
